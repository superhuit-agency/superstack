name: Deploy WP & Next.js to Production
description: This workflow deploys the WordPress backend and Next.js frontend to production when changes are pushed to the corresponding branch/tag.
on:
  # ######## Uncomment below block to enable automatic deployment
  # push:
  #   branches:
  #     - 'production'
  #   # # Only run workflow if push a server tag
  #   # tags:
  #   #   - 'v*.*.*'
  # ########

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Concurrency to prevent multiple deployments at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_backend:
    environment: production
    name: Deploy backend into production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check required variables & secrets
        uses: superhuit-agency/check-env-vars-secrets@v1
        with:
          variables: |
            SSH_PRIVATE_KEY
            SSH_HOST
            SSH_PORT
            SSH_USER
            WORDPRESS_PATH
            WORDPRESS_URL
            WORDPRESS_THEME_NAME
            NEXT_URL
            NEXT_PATH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}

          WORDPRESS_PATH: ${{ vars.WORDPRESS_PATH }}
          WORDPRESS_URL: ${{ vars.WORDPRESS_URL }}
          WORDPRESS_THEME_NAME: ${{ vars.WORDPRESS_THEME_NAME }}

          NEXT_URL: ${{ vars.NEXT_URL }}
          NEXT_PATH: ${{ vars.NEXT_PATH }}

      - name: Setup SSH
        id: ssh
        uses: kuuak/ssh-action@main
        with:
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build Theme
        uses: ./.github/actions/theme-build
        with:
          WORDPRESS_URL: ${{ vars.WORDPRESS_URL }}
          NEXT_URL: ${{ vars.NEXT_URL }}

      - name: Deploy Theme
        uses: ./.github/actions/theme-deploy
        with:
          SERVER: ${{ steps.ssh.outputs.SERVER }}
          WORDPRESS_PATH: ${{ vars.WORDPRESS_PATH }}
          WORDPRESS_THEME_NAME: ${{ vars.WORDPRESS_THEME_NAME }}

      - name: Deploy Composer dependencies
        uses: ./.github/actions/theme-install-composer
        with:
          SERVER: ${{ steps.ssh.outputs.SERVER }}
          WORDPRESS_PATH: ${{ vars.WORDPRESS_PATH }}

      - name: Execute provision script
        shell: bash
        run: |
          ssh ${{ steps.ssh.outputs.SERVER }} \
            "cd ${{ vars.WORDPRESS_PATH }}; \
              env \
                NEXT_URL=\"${{ vars.NEXT_URL }}\" \
                WORDPRESS_PATH=\"${{ vars.WORDPRESS_PATH }}\" \
                WORDPRESS_URL=\"${{ vars.WORDPRESS_URL }}\" \
                WORDPRESS_THEME_NAME=\"${{ vars.WORDPRESS_THEME_NAME }}\" \
                WORDPRESS_DB_HOST=\"${{ vars.WORDPRESS_DB_HOST }}\" \
                WORDPRESS_DB_NAME=\"${{ vars.WORDPRESS_DB_NAME }}\" \
                WORDPRESS_DB_USER=\"${{ vars.WORDPRESS_DB_USER }}\" \
                WORDPRESS_TITLE=\"${{ vars.WORDPRESS_TITLE }}\" \
                WORDPRESS_ADMIN_USER=\"${{ vars.WORDPRESS_ADMIN_USER }}\" \
                WORDPRESS_ADMIN_EMAIL=\"${{ vars.WORDPRESS_ADMIN_EMAIL }}\" \
              /bin/bash -s " < ./wordpress/scripts/provision.sh

  deploy_frontend_vercel:
    environment: production
    name: Deploy frontend into Vercel
    runs-on: ubuntu-latest
    needs: deploy_backend
    if: ${{ vars.VERCEL_PROJECT_ID != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check required variables & secrets
        uses: superhuit-agency/check-env-vars-secrets@v1
        with:
          variables: |
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PR_PREVIEW_DOMAIN: '{REPO}-{PR}.vercel.app'
          GITHUB_DEPLOYMENT_ENV: Production
          VERCEL_SCOPE: superhuit-ch
          PRODUCTION: true
          ALIAS_DOMAINS: ""

  deploy_frontend_ssh:
    environment: production
    name: Deploy frontend via SSH
    runs-on: ubuntu-latest
    needs: deploy_backend
    if: ${{ vars.VERCEL_PROJECT_ID == '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check required variables & secrets
        uses: superhuit-agency/check-env-vars-secrets@v1
        with:
          variables: |
            NEXT_PATH
            PM2_APP_NAME
        env:
          NEXT_PATH: ${{ vars.NEXT_PATH }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}

      - name: Setup SSH
        id: ssh
        uses: kuuak/ssh-action@main
        with:
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build Next.js
        uses: ./.github/actions/next-build
        with:
          SERVER: ${{ steps.ssh.outputs.SERVER }}
          NEXT_PATH: ${{ vars.NEXT_PATH }}
      
      - name: Deploy Next.js
        uses: ./.github/actions/next-deploy
        with:
          SERVER: ${{ steps.ssh.outputs.SERVER }}
          NEXT_PATH: ${{ vars.NEXT_PATH }}

      - name: Restart PM2 app
        uses: ./.github/actions/next-pm2
        with:
          SERVER: ${{ steps.ssh.outputs.SERVER }}
          NEXT_PATH: ${{ vars.NEXT_PATH }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}