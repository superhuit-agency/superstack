name: 'Deploy Next.js'
description: 'Deploy Next.js on any Server via SSH'
inputs:
  SERVER:
    description: 'SSH target (user@host -p port)'
    required: true
  NEXT_PATH:
    description: 'Path on the remote server where Next.js is located (default: /var/www/next)'
    required: false
    default: '/var/www/next'
  KEEP_RELEASES:
    description: 'Number of latest releases to keep on server'
    required: false
    default: '5'

runs:
  using: 'composite'
  steps:
    - name: Download built artifacts
      uses: actions/download-artifact@v8
      with:
        name: next-build
        path: ./deploy-artifacts

    - name: Prepare release folder
      shell: bash
      run: |
        RELEASE_ID="$(date +%Y%m%d%H%M%S)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        CURRENT_PATH='${{ inputs.NEXT_PATH }}'
        APP_ROOT="$(dirname "$CURRENT_PATH")"
        RELEASES_DIR="$APP_ROOT/releases"
        SHARED_DIR="$APP_ROOT/shared"
        RELEASE_PATH="$RELEASES_DIR/$RELEASE_ID"

        echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
        echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
        echo "RELEASES_DIR=$RELEASES_DIR" >> "$GITHUB_ENV"
        echo "SHARED_DIR=$SHARED_DIR" >> "$GITHUB_ENV"
        echo "RELEASE_PATH=$RELEASE_PATH" >> "$GITHUB_ENV"

        ssh ${{ inputs.SERVER }} "mkdir -p '$RELEASES_DIR' '$SHARED_DIR' '$RELEASE_PATH'"

    - name: Deploy shared environment file (if does not exist)
      shell: bash
      run: |
        rsync -auz --ignore-existing \
          next/.env.example \
          ${{ inputs.SERVER }}:${{ env.SHARED_DIR }}/.env

    - name: Upload release files
      shell: bash
      run: |
        rsync -auzv --delete \
          --exclude='.env*' \
          --exclude='ecosystem.config.js' \
          ./deploy-artifacts/next/ \
          ${{ inputs.SERVER }}:${{ env.RELEASE_PATH }}/

    - name: Install production dependencies in release
      shell: bash
      run: |
        ssh ${{ inputs.SERVER }} "
            cd '${{ env.RELEASE_PATH }}' &&
            npm ci --omit=dev && 
            ln -sfn '${{ env.SHARED_DIR }}/.env' .env
          "

    - name: Switch current release atomically
      shell: bash
      run: |
        ssh ${{ inputs.SERVER }} "
            CURRENT_PATH='${{ inputs.NEXT_PATH }}';
            if [ -d \"\$CURRENT_PATH\" ] && [ ! -L \"\$CURRENT_PATH\" ]; then
              mv \"\$CURRENT_PATH\" \"\${CURRENT_PATH}.bak.\$(date +%s)\";
            fi;
            ln -sfn '${{ env.RELEASE_PATH }}' \"\$CURRENT_PATH\"
          "

    - name: Cleanup old releases
      shell: bash
      run: |
        KEEP_RELEASES='${{ inputs.KEEP_RELEASES }}'
        if ! [[ "$KEEP_RELEASES" =~ ^[0-9]+$ ]] || [ "$KEEP_RELEASES" -lt 1 ]; then
          echo "KEEP_RELEASES must be an integer >= 1"
          exit 1
        fi

        START_AT=$((KEEP_RELEASES + 1))
        ssh ${{ inputs.SERVER }} "
            cd '${{ env.RELEASES_DIR }}' || exit 0;
            ls -1dt */ 2>/dev/null | tail -n +${START_AT} | xargs -r rm -rf
          "